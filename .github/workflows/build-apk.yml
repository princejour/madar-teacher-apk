name: Build Teacher APK from ZIP

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unzip project
        run: |
          ZIP_FILE="./TeacherAPK_PasswordOnly_v7_FIXED.zip"
          echo "ZIP_FILE=$ZIP_FILE"
          ls -la
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -name "settings.gradle" -type f -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-App-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
